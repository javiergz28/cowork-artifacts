<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230C0C0C%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%277%27 fill=%27%232BEA60%27/%3E%3C/svg%3E">
<title>Último panel — Multitrend</title>
<meta name="robots" content="noindex">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family: Outfit, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background:#F6F9F7; color:#55625A; font-size:15px; }
  a { color:#16A34A; font-weight:600; }
</style>
</head>
<body>
<p id="msg">Abriendo el último panel publicado…</p>
<script>
/* URL estable: siempre lleva al ciclo más reciente con panel guardado. No hay que tocarla al agregar un ciclo. */
fetch('../data/ciclos.json', { cache: 'no-cache' })
  .then(function (r) { return r.json(); })
  .then(function (d) {
    var c = d.ciclos.filter(function (x) { return x.snapshot; })
                    .sort(function (a, b) { return a.fecha < b.fecha ? 1 : -1; })[0];
    if (!c) throw new Error('sin paneles');
    location.replace('../' + c.snapshot);
  })
  .catch(function () {
    document.getElementById('msg').innerHTML = 'No pude resolver el último panel. <a href="../">Ir al índice de reportes →</a>';
  });
</script>
<noscript><p><a href="../">Ir al índice de reportes →</a></p></noscript>
</body>
</html>
